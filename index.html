<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Fitness Tracker</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182536;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#153c57;color:white;padding:22px max(18px,calc((100vw - 960px)/2))}h1{margin:0;font-size:1.55rem}header p{margin:6px 0 0;color:#d6e8f0}main{max-width:960px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}button,.btn{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;font:inherit;background:#e3eaf2;color:#17354b}button.primary{background:#086c83;color:white}button.danger{background:#fce5e5;color:#a32626}nav button.active{background:#153c57;color:white}.card{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #142b4110}h2{font-size:1.22rem;margin:0 0 14px}h3{font-size:1rem;margin:12px 0 7px}.muted{color:#607083;font-size:.91rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #e8edf3;padding:12px 0}.item:first-of-type{border-top:0}label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #bdcbd8;border-radius:8px;font:inherit;background:white}textarea{min-height:75px}form{margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{background:#eaf5f5;border-radius:20px;padding:4px 9px;font-size:.8rem}.check{display:flex;align-items:center;gap:8px}.check input{width:22px;height:22px}.bar{height:10px;border-radius:10px;background:#e6ebf1;overflow:hidden}.bar>div{height:100%;background:#138a85}small{color:#607083}.hidden{display:none}.stat{font-size:1.8rem;font-weight:750}footer{text-align:center;padding:22px;color:#68798a;font-size:.85rem}@media(max-width:550px){main{padding:12px}.card{padding:14px}header{padding:20px 16px}button{padding:10px}}</style></head><body><header><h1>My Fitness Tracker</h1><p>Exercises · Cassandra sessions · Daily routine · Progress</p></header><main><nav id="tabs"><button data-tab="today" class="active">Today</button><button data-tab="exercises">Exercises</button><button data-tab="sessions">Cassandra</button><button data-tab="progress">Progress</button><button data-tab="backup">Backup</button></nav><div id="view"></div></main><footer>Your entries stay in this browser unless you export a backup. This site does not have an online account or sync.</footer><script>
const KEY='personal-fitness-tracker-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.exercises))state={exercises:[],sessions:[],checks:[],logs:[]};for(const k of ['exercises','sessions','checks','logs'])if(!Array.isArray(state[k]))state[k]=[];let tab='today',editing=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Could not save. Export a backup and check browser storage.')}};const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const day=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const unit=e=>e.unit||'reps';const target=e=>`${esc(e.target||'—')} ${esc(unit(e))}${e.sets?' × '+esc(e.sets)+' sets':''}`;const routine=e=>e.frequency==='twice';function switchTab(t){tab=t;editing=null;render()}$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));switchTab(b.dataset.tab)}};function render(){const v=$('#view');if(tab==='today'){const today=day(),xs=state.exercises.filter(routine),total=xs.length*2,done=state.checks.filter(c=>c.date===today&&xs.some(e=>e.id===c.exerciseId)).length;v.innerHTML=`<div class="card"><div class="row"><div><h2>Today's routine</h2><div class="muted">${esc(today)} · ${done} of ${total} check-ins completed</div></div><div class="stat">${total?Math.round(done/total*100):0}%</div></div><div class="bar"><div style="width:${total?done/total*100:0}%"></div></div></div>${xs.length?xs.map(e=>`<div class="card"><div class="row"><div><strong>${esc(e.name)}</strong><div class="muted">${target(e)}</div></div><span class="tag">Twice daily</span></div><div class="actions">${['AM','PM'].map(part=>`<label class="check"><input type="checkbox" data-check="${esc(e.id)}" data-part="${part}" ${state.checks.some(c=>c.date===today&&c.exerciseId===e.id&&c.part===part)?'checked':''}>${part==='AM'?'Morning':'Evening'}</label>`).join('')}</div>${e.instructions?`<p class="muted">${esc(e.instructions)}</p>`:''}</div>`).join(''):`<div class="card"><h2>No daily exercises yet</h2><p>Add an exercise and choose “Morning and evening” to see it here.</p><button class="primary" onclick="go('exercises')">Add an exercise</button></div>`;v.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{state.checks=state.checks.filter(x=>!(x.date===today&&x.exerciseId===c.dataset.check&&x.part===c.dataset.part));if(c.checked)state.checks.push({date:today,exerciseId:c.dataset.check,part:c.dataset.part});save();render()})}
if(tab==='exercises'){const current=state.exercises.find(x=>x.id===editing);v.innerHTML=`<div class="card"><h2>${current?'Edit exercise':'Add an exercise'}</h2><form id="exerciseForm"><label>Name<input name="name" required maxlength="100" value="${esc(current?.name||'')}" placeholder="e.g. Single-leg balance"></label><div class="grid"><div><label>Category<select name="category">${['Strength','Balance','Mobility','Stretching','Other'].map(x=>`<option ${current?.category===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div><label>Frequency<select name="frequency"><option value="twice" ${current?.frequency==='twice'?'selected':''}>Morning and evening</option><option value="once" ${current?.frequency==='once'?'selected':''}>Once daily</option><option value="other" ${current?.frequency==='other'?'selected':''}>Only when needed</option></select></label></div></div><div class="grid"><div><label>Target amount<input name="target" type="number" min="0" step="any" value="${esc(current?.target||'')}"></label></div><div><label>Unit<select name="unit">${['reps','seconds','minutes','kg'].map(x=>`<option ${unit(current||{})===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div><label>Sets<input name="sets" type="number" min="1" value="${esc(current?.sets||1)}"></label></div></div><label>Cassandra's instructions<textarea name="instructions" placeholder="Technique, posture, breathing, etc.">${esc(current?.instructions||'')}</textarea></label><label>Demonstration video URL (optional)<input name="video" type="url" value="${esc(current?.video||'')}" placeholder="https://..."></label><div class="actions"><button class="primary">${current?'Save changes':'Add exercise'}</button>${current?'<button type="button" onclick="cancelEdit()">Cancel</button>':''}</div></form></div><div class="card"><h2>Exercise library (${state.exercises.length})</h2>${state.exercises.length?state.exercises.map(e=>`<div class="item"><div class="row"><strong>${esc(e.name)}</strong><span class="tag">${esc(e.category)}</span></div><div class="muted">${target(e)} · ${e.frequency==='twice'?'Morning and evening':e.frequency==='once'?'Once daily':'As needed'}</div>${e.instructions?`<p>${esc(e.instructions)}</p>`:''}${/^https:\/\//i.test(e.video||'')?`<a href="${esc(e.video)}" target="_blank" rel="noopener noreferrer">Demonstration video</a>`:''}<div class="actions"><button onclick="editExercise('${esc(e.id)}')">Edit</button><button onclick="startLog('${esc(e.id)}')">Log performance</button><button class="danger" onclick="deleteExercise('${esc(e.id)}')">Delete</button></div></div>`).join(''):'<p class="muted">Your library is empty.</p>'}</div>`;$('#exerciseForm').onsubmit=ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));const obj={...current,...d,id:current?.id||uid(),target:Number(d.target)||0,sets:Number(d.sets)||1};if(current)state.exercises=state.exercises.map(e=>e.id===current.id?obj:e);else state.exercises.push(obj);editing=null;save();render()}}
if(tab==='sessions'){v.innerHTML=`<div class="card"><h2>Record a session with Cassandra</h2><form id="sessionForm"><label>Date<input name="date" type="date" value="${day()}" required></label><label>Duration (minutes)<input name="duration" type="number" min="0" placeholder="60"></label><label>Exercises covered<textarea name="exercises" placeholder="Exercises practised or learned"></textarea></label><label>Notes and instructions<textarea name="notes" placeholder="What Cassandra said; what to practise"></textarea></label><button class="primary">Save session</button></form></div><div class="card"><h2>Session history (${state.sessions.length})</h2>${[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="item"><div class="row"><strong>${esc(s.date)}</strong><button class="danger" onclick="deleteSession('${esc(s.id)}')">Delete</button></div><div class="muted">${esc(s.duration||'—')} minutes</div><p>${esc(s.exercises)}</p><p class="muted">${esc(s.notes)}</p></div>`).join('')||'<p class="muted">No sessions recorded yet.</p>'}</div>`;$('#sessionForm').onsubmit=ev=>{ev.preventDefault();state.sessions.push({id:uid(),...Object.fromEntries(new FormData(ev.target))});save();render()}}
if(tab==='progress'){const logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date));const past=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')});const planned=state.exercises.filter(routine).length*2*7,completed=state.checks.filter(c=>past.includes(c.date)&&state.exercises.some(e=>e.id===c.exerciseId&&routine(e))).length;v.innerHTML=`<div class="grid"><div class="card"><div class="muted">Last 7 days · routine check-ins</div><div class="stat">${completed} / ${planned}</div><div class="bar"><div style="width:${planned?Math.min(100,completed/planned*100):0}%"></div></div></div><div class="card"><div class="muted">Sessions with Cassandra</div><div class="stat">${state.sessions.length}</div></div></div><div class="card"><h2>Log exercise performance</h2><form id="logForm"><label>Exercise<select name="exerciseId" required>${state.exercises.map(e=>`<option value="${esc(e.id)}" ${editing===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><label>Date<input name="date" type="date" value="${day()}" required></label><div class="grid"><div><label>Actual amount<input name="value" type="number" min="0" step="any" required placeholder="e.g. 15"></label></div><div><label>Difficulty<select name="difficulty"><option>Easy</option><option selected>Moderate</option><option>Hard</option></select></label></div></div><label>Notes<input name="notes" placeholder="How it felt; technique improvements"></label><button class="primary" ${state.exercises.length?'':'disabled'}>Save result</button></form></div><div class="card"><h2>Performance history</h2>${logs.length?logs.map(l=>{const e=state.exercises.find(x=>x.id===l.exerciseId);return `<div class="item"><div class="row"><strong>${esc(e?.name||'Deleted exercise')}</strong><button class="danger" onclick="deleteLog('${esc(l.id)}')">Delete</button></div><div class="muted">${esc(l.date)} · ${esc(l.value)} ${esc(e?unit(e):'units')} · ${esc(l.difficulty)}</div>${l.notes?`<p>${esc(l.notes)}</p>`:''}</div>`}).join(''):'<p class="muted">Record your first result to start tracking improvements.</p>'}</div>`;$('#logForm').onsubmit=ev=>{ev.preventDefault();state.logs.push({id:uid(),...Object.fromEntries(new FormData(ev.target))});editing=null;save();render()}}
if(tab==='backup'){v.innerHTML=`<div class="card"><h2>Protect your records</h2><p>Your data is saved only in this browser on this device. It will not automatically appear on your other devices. Clearing browser data may erase it.</p><p><strong>Export a backup regularly</strong>, especially before changing phones or browsers.</p><div class="actions"><button class="primary" id="export">Download JSON backup</button></div></div><div class="card"><h2>Restore from a backup</h2><p class="muted">Importing a backup replaces all current records in this browser. Export your current data first.</p><input type="file" id="import" accept=".json,application/json"></div>`;$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fitness-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!['exercises','sessions','checks','logs'].every(k=>Array.isArray(data[k])))throw Error('Invalid backup');if(confirm('Replace all current records with this backup?')){state=data;save();render();alert('Backup restored')}}catch(e){alert('Could not import this file. Choose a valid fitness tracker JSON backup.')}}}}
function go(t){$('#tabs').querySelector(`[data-tab="${t}"]`).click()}function editExercise(id){editing=id;render();window.scrollTo(0,0)}function cancelEdit(){editing=null;render()}function startLog(id){go('progress');editing=id;render();window.scrollTo(0,0)}function deleteExercise(id){if(confirm('Delete this exercise? Past performance entries remain but will no longer show its name.')){state.exercises=state.exercises.filter(e=>e.id!==id);state.checks=state.checks.filter(c=>c.exerciseId!==id);save();render()}}function deleteSession(id){if(confirm('Delete this session?')){state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}}function deleteLog(id){if(confirm('Delete this performance entry?')){state.logs=state.logs.filter(l=>l.id!==id);save();render()}}render();
</script></body></html>
